# `make types`: the type errors that can stop the app, and only those.
#
# The [tool.mypy] block of pyproject.toml is Artisan's strict configuration and
# reports 8000 errors here, nearly all of them missing annotations and the
# attributes of mixin classes. That debt stays visible through
# `mypy tilauscope/roast_plan_model.py test`; this gate must stay at zero.

[mypy]
python_version = 3.14
mypy_path = test
check_untyped_defs = True
ignore_missing_imports = True
show_error_codes = True
enable_error_code = possibly-undefined
disable_error_code = attr-defined,union-attr,arg-type,assignment,misc,index,has-type,operator,override,call-overload,var-annotated,method-assign,type-var,comparison-overlap,func-returns-value,import-untyped,annotation-unchecked,literal-required,typeddict-unknown-key

[mypy-artisanlib.*]
ignore_errors = True

[mypy-plus.*]
ignore_errors = True

# Its stub file has a syntax error on Python 3.14.
[mypy-zxingcpp]
follow_imports = skip
