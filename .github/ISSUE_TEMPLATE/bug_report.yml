name: Bug report
description: Report a problem with TilauScope
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can.

  - type: input
    id: version
    attributes:
      label: TilauScope version
      description: Shown in the app title bar / About dialog (e.g. 4.1.0)
      placeholder: "4.1.0"
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Build number
      description: Shown next to the version (e.g. 16)
      placeholder: "16"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Roaster / hardware involved (if relevant)
      description: e.g. Skywalker V2, DiFluid AirWave, DiFluid Omniflux, Acaia scale, Niimbot printer...
      placeholder: "Skywalker V2"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant log output or attach screenshots here.
