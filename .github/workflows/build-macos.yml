name: Build TilauScope (macOS)
run-name: Build TilauScope (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    # This file ships inside the published snapshot and is meant to run in the
    # public repository only. In the private repo it stays inert: builds there
    # are done locally from `dev`.
    if: github.repository == 'neuralldev/tilauscope_fork'
    permissions:
      contents: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-versionfile -r ./src/requirements.txt

      - name: Extract Version and Build
        run: |
          VERSION=$(sed -n "s/__version__ = ['\"]\(.*\)['\"]/\1/p" src/artisanlib/__init__.py | xargs)
          BUILD=$(sed -n "s/__build__ = ['\"]\(.*\)['\"]/\1/p" src/artisanlib/__init__.py | xargs)
          
          if [ -z "$BUILD" ]; then BUILD="1"; fi
          
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$BUILD" >> $GITHUB_ENV
    
          echo "Version: $VERSION"
          echo "Build: $BUILD"

      - name: Check signing secrets are present
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=""
          for v in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see wiki/macos-signing-setup.md"
            exit 1
          fi

      - name: Build with PyInstaller
        env:
          PYTHON_V: '3.14'
          TILAU_SKIP_DMG: '1'
        run: |
          rm -rf build dist
          cd src
          pyinstaller --clean setup-tilauscope-mac.spec

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/tilau-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo -n "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Default is a 5-minute auto-lock; the notarization wait is far longer.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # Developer ID certs chain through this intermediate, which is not in
          # the default keychain. Without it the chain stops at an unknown
          # issuer, the identity reports CSSMERR_TP_NOT_TRUSTED and codesign
          # refuses to use it. The .p12 may already carry it — importing twice
          # is harmless, so do not depend on the export having included it.
          curl -sSfL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security add-certificates -k "$KEYCHAIN_PATH" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          # Without this, codesign triggers an interactive UI prompt and hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -n 's/.*"\(.*\)".*/\1/p')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the .p12 — an Apple Development or Mac App Distribution certificate cannot notarize."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Using identity: $IDENTITY"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Sign, package, notarize and staple
        env:
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_VERSION: ${{ env.APP_VERSION }}
          APP_BUILD: ${{ env.APP_BUILD }}
          # Best-effort notarization: if Apple rejects, times out or is down, the
          # signed DMG still ships (see the "not notarized" note appended to the
          # public release). Signing and DMG creation themselves remain fatal.
          NOTARIZE_REQUIRED: '0'
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"

          DMG="src/tilauscope-${APP_VERSION}-build${APP_BUILD}.dmg"
          chmod +x src/sign-notarize-macos.sh
          src/sign-notarize-macos.sh "src/dist/TilauScope.app" "$DMG"

          rm -f "$APPLE_API_KEY_PATH"

          # Carry the notarization outcome to the release-notes step.
          NOTARIZED=$(cat "${DMG}.notarized" 2>/dev/null || echo 0)
          echo "NOTARIZED=$NOTARIZED" >> $GITHUB_ENV
          if [ "$NOTARIZED" = "1" ]; then
            echo "::notice::DMG signed, notarized and stapled."
          else
            echo "::warning::DMG signed but NOT notarized — shipping with a manual-authorization note."
          fi

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/tilau-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" 2>/dev/null || true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ env.APP_VERSION }}
          APP_BUILD: ${{ env.APP_BUILD }}
          NOTARIZED: ${{ env.NOTARIZED }}
        run: |
          TAG="v${APP_VERSION}"
          DMG="src/tilauscope-${APP_VERSION}-build${APP_BUILD}.dmg"

          # One release per public version, carrying both platform installers.
          # The macOS and Windows jobs race to create it; whichever loses simply
          # finds it already there and uploads its own asset into it.
          gh release create "$TAG" \
            --title "TilauScope ${APP_VERSION}" \
            --notes "Automated build from commit ${GITHUB_SHA}. See whatsnew.md for what changed." \
            || echo "Release $TAG already exists - uploading into it."

          gh release upload "$TAG" "$DMG" --clobber

          # Only the macOS job ever edits the notes, so this cannot race with
          # the Windows job. Guard against re-running the workflow twice.
          if [ "${NOTARIZED}" != "1" ]; then
            BODY=$(gh release view "$TAG" --json body -q .body)
            case "$BODY" in
              *"NOT notarized"*)
                echo "Notarization warning already present." ;;
              *)
                gh release edit "$TAG" --notes "$(printf '%s\n\n%s\n%s\n\n%s\n\n%s\n' \
                  "$BODY" \
                  "**This macOS build is signed but NOT notarized.** On first launch macOS" \
                  "will refuse to open it. After dragging TilauScope to Applications, run once in Terminal:" \
                  "    xattr -dr com.apple.quarantine /Applications/TilauScope.app" \
                  "(or right-click the app, choose Open, then confirm).")" ;;
            esac
          fi

      - name: Notify on Discord
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APP_VERSION: ${{ env.APP_VERSION }}
          APP_BUILD: ${{ env.APP_BUILD }}
          STATUS: ${{ job.status }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${APP_VERSION}"
          TEXT="TilauScope ${APP_VERSION} build ${APP_BUILD} (macOS): ${STATUS} - ${URL}"
          jq -n --arg c "$TEXT" '{content: $c}' \
            | curl -sS -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord notification failed (non-fatal)."
